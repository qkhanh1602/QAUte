# Render supplies these secrets at runtime; never package local credentials.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
cloudinary.url=${CLOUDINARY_URL}
app.email.provider=brevo
app.email.brevo-api-key=${BREVO_API_KEY}
app.email.from=${EMAIL_FROM}
app.allowed-origins=${APP_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL}}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.jpa.hibernate.ddl-auto=validate
app.diagnostics.pool-stalls=true
spring.datasource.hikari.leak-detection-threshold=15000
