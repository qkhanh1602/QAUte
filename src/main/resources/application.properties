spring.application.name=TuVanSinhVien
spring.config.import=optional:classpath:application-local.properties

# Server Port
server.port=8080

# Database Configuration (SQL Server QAUTE)
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1434;databaseName=QAUTE;trustServerCertificate=true;encrypt=false}
spring.datasource.username=${DB_USERNAME:qaute_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Timezone & Encoding
spring.jackson.time-zone=Asia/Ho_Chi_Minh
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Session Security
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.example.TuVanSinhVien=INFO
logging.level.org.springframework.security=WARN

# CORS/WebSocket origins, comma separated
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.google-sso.enabled=${GOOGLE_SSO_ENABLED:false}
