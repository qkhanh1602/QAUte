<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header-css(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title + ' - Hệ thống Tư vấn Sinh viên QAUTE'}">QAUTE - Tư vấn Sinh viên</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3.3 & Bootstrap Icons (Primary CDN + Fallback CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" crossorigin="anonymous">
    
    <style>
        :root {
            /* === BẢNG MÀU CHUẨN MỚI QAUTE === */
            --qaute-navbar: #1E3A5F;           /* Navbar chính: Xanh navy (30, 58, 95) */
            --qaute-navbar-rgb: 30, 58, 95;
            --qaute-navbar-hover: #294E78;     /* Navbar hover: Navy sáng (41, 78, 120) */
            --qaute-primary: #2563EB;          /* Màu chủ đạo / nút chính: Xanh dương (37, 99, 235) */
            --qaute-primary-rgb: 37, 99, 235;
            --qaute-primary-hover: #1D4ED8;    /* Hover nút chính: Xanh đậm (29, 78, 216) */
            --qaute-secondary: #0F766E;        /* Màu phụ: Xanh teal (15, 118, 110) */
            --qaute-secondary-rgb: 15, 118, 110;
            --qaute-teal-light: #14B8A6;       /* Teal sáng: (20, 184, 166) */
            --qaute-teal-light-rgb: 20, 184, 166;
            --qaute-bg: #F8FAFC;               /* Background toàn trang: Xám trắng (248, 250, 252) */
            --qaute-bg-section: #F1F5F9;       /* Background section: (241, 245, 249) */
            --qaute-card-bg: #FFFFFF;          /* Card: Trắng (255, 255, 255) */
            --qaute-border: #E2E8F0;           /* Border: Xám nhạt (226, 232, 240) */
            --qaute-heading: #0F172A;          /* Chữ tiêu đề: (15, 23, 42) */
            --qaute-text: #334155;             /* Chữ thường: (51, 65, 85) */
            --qaute-muted: #64748B;            /* Chữ phụ: (100, 116, 139) */
            --qaute-success: #16A34A;          /* Thành công: (22, 163, 74) */
            --qaute-success-rgb: 22, 163, 74;
            --qaute-warning: #D97706;          /* Cảnh báo: (217, 119, 6) */
            --qaute-warning-rgb: 217, 119, 6;
            --qaute-danger: #DC2626;           /* Lỗi: (220, 38, 38) */
            --qaute-danger-rgb: 220, 38, 38;

            /* Backward compatibility alias */
            --qaute-sidebar: var(--qaute-navbar);

            /* Bootstrap 5.3 Overrides */
            --bs-primary: #2563EB;
            --bs-primary-rgb: 37, 99, 235;
            --bs-secondary: #0F766E;
            --bs-secondary-rgb: 15, 118, 110;
            --bs-info: #14B8A6;
            --bs-info-rgb: 20, 184, 166;
            --bs-success: #16A34A;
            --bs-success-rgb: 22, 163, 74;
            --bs-warning: #D97706;
            --bs-warning-rgb: 217, 119, 6;
            --bs-danger: #DC2626;
            --bs-danger-rgb: 220, 38, 38;
            --bs-light: #F1F5F9;
            --bs-light-rgb: 241, 245, 249;
            --bs-tertiary-bg: #F1F5F9;
            --bs-body-bg: #F8FAFC;
            --bs-body-color: #334155;
            --bs-secondary-color: #64748B;
            --bs-heading-color: #0F172A;
            --bs-border-color: #E2E8F0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--qaute-bg) !important;
            color: var(--qaute-text) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === TYPOGRAPHY === */
        h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6 {
            color: var(--qaute-heading) !important;
            font-weight: 700;
        }

        .text-dark {
            color: var(--qaute-heading) !important;
        }

        .text-body {
            color: var(--qaute-text) !important;
        }

        .text-secondary {
            color: var(--qaute-muted) !important;
        }

        .text-muted {
            color: var(--qaute-muted) !important;
        }

        .text-primary {
            color: var(--qaute-primary) !important;
        }

        .text-success {
            color: var(--qaute-success) !important;
        }

        .text-warning {
            color: var(--qaute-warning) !important;
        }

        .text-danger {
            color: var(--qaute-danger) !important;
        }

        /* === NAVBAR CHÍNH === */
        .navbar-qaute {
            background-color: var(--qaute-navbar) !important;
            background-image: none !important;
            box-shadow: 0 4px 20px -2px rgba(30, 58, 95, 0.35);
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .navbar-brand-qaute {
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
            color: #FFFFFF !important;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-badge {
            background-color: var(--qaute-teal-light); /* #14B8A6 */
            color: #FFFFFF;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-link-qaute {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            font-size: 0.95rem;
            padding: 0.5rem 0.9rem !important;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link-qaute:hover {
            color: #FFFFFF !important;
            background-color: var(--qaute-navbar-hover) !important; /* #294E78 Navbar hover */
        }

        .nav-link-qaute.active {
            color: #FFFFFF !important;
            background-color: var(--qaute-primary) !important; /* #2563EB */
            font-weight: 600;
        }

        .navbar-qaute .dropdown-toggle:hover {
            background-color: var(--qaute-navbar-hover) !important;
        }

        /* === BACKGROUND SECTION & CARD === */
        .qaute-section-bg, .bg-section {
            background-color: var(--qaute-bg-section) !important; /* #F1F5F9 */
        }

        .bg-light {
            background-color: var(--qaute-bg-section) !important; /* #F1F5F9 */
        }

        .qaute-card, .card {
            background-color: var(--qaute-card-bg) !important; /* #FFFFFF */
            border: 1px solid var(--qaute-border) !important;  /* #E2E8F0 */
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .qaute-card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -4px rgba(15, 23, 42, 0.08);
            border-color: #cbd5e1 !important;
        }

        .border, .border-top, .border-bottom, .border-start, .border-end {
            border-color: var(--qaute-border) !important;
        }

        /* === BUTTONS === */
        .btn-qaute-primary, .btn-primary {
            background: linear-gradient(135deg, var(--qaute-primary) 0%, #3b82f6 100%) !important;
            background-color: var(--qaute-primary) !important; /* #2563EB */
            border-color: var(--qaute-primary) !important;
            color: #FFFFFF !important;
            font-weight: 600;
            padding: 0.6rem 1.3rem;
            border-radius: 0.6rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        .btn-qaute-primary:hover, .btn-qaute-primary:focus,
        .btn-primary:hover, .btn-primary:focus {
            background: linear-gradient(135deg, var(--qaute-primary-hover) 0%, var(--qaute-primary) 100%) !important;
            background-color: var(--qaute-primary-hover) !important; /* #1D4ED8 */
            border-color: var(--qaute-primary-hover) !important;
            color: #FFFFFF !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .btn-qaute-outline, .btn-outline-primary {
            border: 1.5px solid var(--qaute-primary) !important;
            color: var(--qaute-primary) !important;
            font-weight: 600;
            padding: 0.55rem 1.2rem;
            border-radius: 0.6rem;
            background: transparent !important;
            transition: all 0.2s ease;
        }

        .btn-qaute-outline:hover, .btn-outline-primary:hover {
            background-color: var(--qaute-primary) !important;
            border-color: var(--qaute-primary) !important;
            color: #FFFFFF !important;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-qaute-accent {
            background-color: var(--qaute-teal-light) !important; /* #14B8A6 */
            border: none !important;
            color: #FFFFFF !important;
            font-weight: 700;
            padding: 0.55rem 1.2rem;
            border-radius: 50rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(20, 184, 166, 0.25);
        }

        .btn-qaute-accent:hover {
            background-color: var(--qaute-secondary) !important; /* #0F766E */
            color: #FFFFFF !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.35);
        }

        .btn-success {
            background-color: var(--qaute-success) !important; /* #16A34A */
            border-color: var(--qaute-success) !important;
            color: #FFFFFF !important;
        }
        .btn-success:hover {
            background-color: #15803d !important;
            border-color: #15803d !important;
            color: #FFFFFF !important;
        }

        .btn-outline-success {
            border-color: var(--qaute-success) !important;
            color: var(--qaute-success) !important;
        }
        .btn-outline-success:hover {
            background-color: var(--qaute-success) !important;
            color: #FFFFFF !important;
        }

        .btn-warning {
            background-color: var(--qaute-warning) !important; /* #D97706 */
            border-color: var(--qaute-warning) !important;
            color: #FFFFFF !important;
        }
        .btn-warning:hover {
            background-color: #b45309 !important;
            border-color: #b45309 !important;
            color: #FFFFFF !important;
        }

        .btn-outline-warning {
            border-color: var(--qaute-warning) !important;
            color: var(--qaute-warning) !important;
        }
        .btn-outline-warning:hover {
            background-color: var(--qaute-warning) !important;
            color: #FFFFFF !important;
        }

        .btn-danger {
            background-color: var(--qaute-danger) !important; /* #DC2626 */
            border-color: var(--qaute-danger) !important;
            color: #FFFFFF !important;
        }
        .btn-danger:hover {
            background-color: #b91c1c !important;
            border-color: #b91c1c !important;
            color: #FFFFFF !important;
        }

        .btn-outline-danger {
            border-color: var(--qaute-danger) !important;
            color: var(--qaute-danger) !important;
        }
        .btn-outline-danger:hover {
            background-color: var(--qaute-danger) !important;
            color: #FFFFFF !important;
        }

        .btn-secondary {
            background-color: var(--qaute-secondary) !important; /* #0F766E */
            border-color: var(--qaute-secondary) !important;
            color: #FFFFFF !important;
        }
        .btn-secondary:hover {
            background-color: #115e59 !important;
            border-color: #115e59 !important;
            color: #FFFFFF !important;
        }

        .btn-info {
            background-color: var(--qaute-teal-light) !important; /* #14B8A6 */
            border-color: var(--qaute-teal-light) !important;
            color: #FFFFFF !important;
        }
        .btn-info:hover {
            background-color: var(--qaute-secondary) !important; /* #0F766E */
            border-color: var(--qaute-secondary) !important;
            color: #FFFFFF !important;
        }

        .btn-outline-info {
            border-color: var(--qaute-teal-light) !important;
            color: var(--qaute-secondary) !important;
        }
        .btn-outline-info:hover {
            background-color: var(--qaute-teal-light) !important;
            color: #FFFFFF !important;
        }

        /* === SUBNAV & SIDEBAR STYLES === */
        .qaute-subnav {
            background-color: var(--qaute-card-bg);
            border: 1px solid var(--qaute-border);
            border-radius: 50rem;
            padding: 0.35rem 0.5rem;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03);
        }

        .qaute-sidebar-card {
            background-color: var(--qaute-card-bg);
            border: 1px solid var(--qaute-border);
            border-radius: 1rem;
            overflow: hidden;
        }

        .qaute-sidebar-header {
            background-color: var(--qaute-navbar);
            color: #FFFFFF;
            padding: 0.85rem 1.2rem;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* === STATUS BADGES === */
        .status-badge {
            font-weight: 600;
            font-size: 0.8rem;
            padding: 0.35rem 0.75rem;
            border-radius: 50rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-ChoTiepNhan, .status-ChoDuyet {
            background-color: #FEF3C7;
            color: var(--qaute-warning); /* #D97706 */
            border: 1px solid #FDE68A;
        }

        .status-DangXuLy {
            background-color: #CCFBF1;
            color: var(--qaute-secondary); /* #0F766E */
            border: 1px solid #99F6E4;
        }

        .status-DaPhanHoi, .status-DaXacNhan, .status-HoanThanh {
            background-color: #DCFCE7;
            color: var(--qaute-success); /* #16A34A */
            border: 1px solid #86EFAC;
        }

        .status-TuChoi, .status-Huy {
            background-color: #FEE2E2;
            color: var(--qaute-danger); /* #DC2626 */
            border: 1px solid #FECACA;
        }

        .status-Dong {
            background-color: var(--qaute-bg-section); /* #F1F5F9 */
            color: var(--qaute-muted); /* #64748B */
            border: 1px solid var(--qaute-border); /* #E2E8F0 */
        }

        /* === ALERTS === */
        .alert-success {
            background-color: #F0FDF4 !important;
            color: #166534 !important;
            border-color: #BBF7D0 !important;
        }
        .alert-warning {
            background-color: #FFFBEB !important;
            color: #92400E !important;
            border-color: #FDE68A !important;
        }
        .alert-danger {
            background-color: #FEF2F2 !important;
            color: #991B1B !important;
            border-color: #FECACA !important;
        }
        .alert-info {
            background-color: #F0FDFA !important;
            color: #115E59 !important;
            border-color: #99F6E4 !important;
        }

        /* === BOOTSTRAP SUBTLE BADGES & BACKGROUNDS === */
        .bg-primary-subtle {
            background-color: #EFF6FF !important;
            color: var(--qaute-primary) !important;
        }
        .bg-secondary-subtle {
            background-color: #F0FDFA !important;
            color: var(--qaute-secondary) !important;
        }
        .bg-success-subtle {
            background-color: #F0FDF4 !important;
            color: var(--qaute-success) !important;
        }
        .bg-warning-subtle {
            background-color: #FFFBEB !important;
            color: var(--qaute-warning) !important;
        }
        .bg-danger-subtle {
            background-color: #FEF2F2 !important;
            color: var(--qaute-danger) !important;
        }
        .bg-info-subtle {
            background-color: #F0FDFA !important;
            color: var(--qaute-teal-light) !important;
        }

        /* === HERO BANNER === */
        .hero-banner {
            background: linear-gradient(135deg, #1E3A5F 0%, #1D4ED8 55%, #2563EB 100%);
            color: #FFFFFF;
            padding: 4.5rem 0 3.5rem 0;
            border-radius: 0 0 2.5rem 2.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 30px -10px rgba(30, 58, 95, 0.3);
        }

        /* === CHAT BUBBLES === */
        .chat-bubble-sender {
            background: linear-gradient(135deg, var(--qaute-primary) 0%, var(--qaute-primary-hover) 100%);
            color: #FFFFFF;
            border-radius: 1.2rem 1.2rem 0.2rem 1.2rem;
            padding: 0.8rem 1.1rem;
            max-width: 75%;
            margin-left: auto;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
        }

        .chat-bubble-receiver {
            background-color: var(--qaute-card-bg); /* #FFFFFF */
            color: var(--qaute-text); /* #334155 */
            border: 1px solid var(--qaute-border); /* #E2E8F0 */
            border-radius: 1.2rem 1.2rem 1.2rem 0.2rem;
            padding: 0.8rem 1.1rem;
            max-width: 75%;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.04);
        }

        .rating-stars {
            color: var(--qaute-warning); /* #D97706 */
            font-size: 1.2rem;
        }

        /* === FORM CONTROLS FOCUS === */
        .form-control, .form-select {
            color: var(--qaute-text);
            background-color: var(--qaute-card-bg);
            border: 1px solid var(--qaute-border);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--qaute-primary);
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
            color: var(--qaute-heading);
        }
    </style>
    <link th:href="@{/css/qaute-theme.css}" rel="stylesheet">
</head>

<body>
<div th:fragment="navbar" class="sticky-top">
    <nav class="navbar navbar-expand-lg navbar-qaute">
        <div class="container">
            <!-- Brand Logo (Pure Inline SVG - 100% Never Missing or Broken) -->
            <a class="navbar-brand navbar-brand-qaute" th:href="@{/}">
                <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="flex-shrink-0">
                    <rect width="40" height="40" rx="10" fill="url(#qauteLogoNavGrad)"/>
                    <path d="M20 9L34 16.5L20 24L6 16.5L20 9Z" fill="#FFFFFF"/>
                    <path d="M11.5 20V26C11.5 29.2 15.2 31.5 20 31.5C24.8 31.5 28.5 29.2 28.5 26V20L20 24.5L11.5 20Z" fill="#FFFFFF" fill-opacity="0.88"/>
                    <path d="M34 17.5V26.5" stroke="#14B8A6" stroke-width="2.2" stroke-linecap="round"/>
                    <circle cx="34" cy="27.5" r="1.8" fill="#14B8A6"/>
                    <defs>
                        <linearGradient id="qauteLogoNavGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#2563EB"/>
                            <stop offset="1" stop-color="#14B8A6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span class="fw-extrabold text-white">QAUTE</span>
            </a>
            
            <button class="navbar-toggler text-white border-white border-opacity-50" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-label="Menu">
                <i class="bi bi-list fs-2"></i>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link nav-link-qaute" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i>Trang chủ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-qaute" th:href="@{/faq}">
                            <i class="bi bi-question-circle me-1"></i>Hỏi đáp
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-qaute" th:href="@{/articles}">
                            <i class="bi bi-journal-text me-1"></i>Bài viết
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-qaute" th:href="@{/advisors}">
                            <i class="bi bi-people me-1"></i>Cố vấn
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <!-- When NOT Authenticated -->
                    <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3 rounded-pill fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                        </a>
                        <a th:href="@{/register}" class="btn btn-qaute-accent btn-sm px-3 rounded-pill fw-bold">
                            <i class="bi bi-person-plus me-1"></i>Đăng ký SV
                        </a>
                    </div>

                    <!-- When Authenticated -->
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                        <!-- Quick Role Dashboard Link -->
                        <div sec:authorize="hasRole('SinhVien')">
                            <a th:href="@{/student/dashboard}" class="btn btn-outline-light btn-sm rounded-pill fw-semibold">
                                <i class="bi bi-speedometer2 me-1"></i>Cổng Sinh viên
                            </a>
                        </div>
                        <div sec:authorize="hasRole('CoVan')">
                            <a th:href="@{/advisor/dashboard}" class="btn btn-warning text-dark btn-sm rounded-pill fw-bold">
                                <i class="bi bi-briefcase me-1"></i>Bàn Cố vấn
                            </a>
                        </div>
                        <div sec:authorize="hasRole('Admin')">
                            <a th:href="@{/admin/dashboard}" class="btn btn-danger btn-sm rounded-pill fw-bold">
                                <i class="bi bi-shield-lock me-1"></i>Quản trị viên
                            </a>
                        </div>

                        <!-- User Profile Dropdown -->
                        <div class="dropdown">
                            <button class="btn btn-link text-white text-decoration-none dropdown-toggle d-flex align-items-center gap-2 p-1 rounded-pill" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="background: rgba(255,255,255,0.1);">
                                <div class="user-avatar user-avatar-sm">
                                    <img th:if="${#authentication.principal.avatarUrl != null and !#strings.isEmpty(#authentication.principal.avatarUrl)}"
                                         th:src="${#authentication.principal.avatarUrl}" alt="Ảnh đại diện">
                                    <span th:unless="${#authentication.principal.avatarUrl != null and !#strings.isEmpty(#authentication.principal.avatarUrl)}"
                                          th:text="${#authentication.principal.avatarInitial}">U</span>
                                </div>
                                <span class="d-none d-md-inline fw-semibold text-white pe-2" th:text="${#authentication.principal.hoTen}">Người dùng</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 mt-2 p-2" style="min-width: 220px;">
                                <li class="px-3 py-2 border-bottom">
                                    <div class="fw-bold text-dark" sec:authentication="name">Username</div>
                                    <small class="badge bg-primary-subtle text-primary mt-1" sec:authorize="hasRole('SinhVien')">Sinh viên</small>
                                    <small class="badge bg-warning-subtle text-warning mt-1" sec:authorize="hasRole('CoVan')">Cán bộ / Cố vấn</small>
                                    <small class="badge bg-danger-subtle text-danger mt-1" sec:authorize="hasRole('Admin')">Quản trị viên</small>
                                </li>
                                <li>
                                    <a class="dropdown-item rounded-2 py-2 d-flex align-items-center" th:href="@{/profile}">
                                        <i class="bi bi-person-circle me-2 text-primary"></i>Hồ sơ cá nhân
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider my-1"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="m-0">
                                        <button type="submit" class="dropdown-item rounded-2 py-2 text-danger fw-semibold d-flex align-items-center">
                                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
