<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css('Hồ sơ cá nhân')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="fw-bold text-dark mb-4">Hồ sơ cá nhân</h2>

            <div th:if="${successMessage}" class="alert alert-success py-2 small mb-3">
                <i class="bi bi-check-circle-fill me-1"></i><span th:text="${successMessage}">Thành công</span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small mb-3">
                <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="${errorMessage}">Lỗi</span>
            </div>

            <!-- Profile Info Card -->
            <div class="qaute-card p-4 mb-4 shadow-sm border-0">
                <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fs-2 fw-bold" style="width: 70px; height: 70px;">
                        <span th:text="${#strings.substring(user.hoTen, 0, 1).toUpperCase()}">U</span>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-1 text-dark" th:text="${user.hoTen}">Họ tên người dùng</h4>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${user.vaiTro}">SinhVien</span>
                        <span class="text-muted small ms-2"><i class="bi bi-calendar3 me-1"></i>Tham gia từ: <span th:text="${#temporals.format(user.ngayTao, 'dd/MM/yyyy')}">2026</span></span>
                    </div>
                </div>

                <!-- If Student, show Student details (MSSV, Khoa, Lop) -->
                <div th:if="${sinhVien != null}" class="bg-light p-3 rounded-3 mb-4">
                    <h6 class="fw-bold text-dark mb-2">Thông tin học vụ sinh viên</h6>
                    <div class="row g-2 small">
                        <div class="col-md-6"><strong>MSSV:</strong> <span th:text="${sinhVien.mssv}">21110001</span></div>
                        <div class="col-md-6"><strong>Lớp:</strong> <span th:text="${sinhVien.lop}">21110CLC1</span></div>
                        <div class="col-md-6"><strong>Khoa:</strong> <span th:text="${sinhVien.khoa}">Khoa CNTT</span></div>
                        <div class="col-md-6"><strong>Ngành:</strong> <span th:text="${sinhVien.nganh}">KTPM</span></div>
                    </div>
                </div>

                <form th:action="@{/profile/update}" method="post">
                    <h6 class="fw-bold text-dark mb-3">Cập nhật thông tin liên lạc</h6>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Địa chỉ Email</label>
                            <input type="email" name="email" th:value="${user.email}" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Số điện thoại</label>
                            <input type="text" name="soDienThoai" th:value="${user.soDienThoai}" class="form-control form-control-sm">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm px-4 fw-semibold rounded-pill">Lưu thông tin</button>
                </form>
            </div>

            <!-- Change Password Card -->
            <div class="qaute-card p-4 shadow-sm border-0">
                <h5 class="fw-bold text-dark mb-3">Đổi mật khẩu</h5>
                <form th:action="@{/profile/change-password}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Mật khẩu hiện tại</label>
                            <input type="password" name="oldPassword" class="form-control form-control-sm" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Mật khẩu mới</label>
                            <input type="password" name="newPassword" class="form-control form-control-sm" placeholder="Tối thiểu 6 ký tự" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-outline-danger btn-sm px-4 fw-semibold rounded-pill">Đổi mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
