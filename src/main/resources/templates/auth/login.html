<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css('Đăng nhập hệ thống')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center py-5" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2">
                    <i class="bi bi-mortarboard-fill text-primary fs-1"></i>
                    <span class="fs-2 fw-extrabold text-dark tracking-tight">QAUTE</span>
                </a>
                <p class="text-muted small">Cổng Đăng Nhập Hệ Thống Tư Vấn Sinh Viên</p>
            </div>

            <div class="qaute-card p-4 p-md-5 shadow-lg border-0">
                <h4 class="fw-bold text-dark mb-3 text-center">Đăng nhập tài khoản</h4>

                <!-- Flash messages -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorMessage}">Lỗi đăng nhập</span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success py-2 small mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${successMessage}">Thành công</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-dark">Tên đăng nhập hoặc Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" id="usernameInput" name="username" class="form-control border-start-0 ps-0" placeholder="admin, sinhvien1, covan.cntt..." required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold text-dark mb-0">Mật khẩu</label>
                            <a th:href="@{/faq}" class="text-muted small text-decoration-none">Quên mật khẩu?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" id="passwordInput" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-qaute-primary w-100 py-2 fw-bold rounded-3 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </button>
                </form>

                <!-- 1-Click Demo Fill Buttons -->
                <div class="p-3 bg-light rounded-3 border mb-3">
                    <div class="small fw-bold text-secondary mb-2 text-center">
                        <i class="bi bi-lightning-charge-fill text-warning me-1"></i>Đăng nhập nhanh tài khoản mẫu để test:
                    </div>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-danger btn-sm text-start" onclick="fillLogin('admin', 'Admin@123')">
                            <i class="bi bi-shield-lock me-1"></i><strong>Admin</strong> (admin / Admin@123)
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-sm text-start" onclick="fillLogin('covan.cntt', 'Covan@123')">
                            <i class="bi bi-person-badge me-1"></i><strong>Cố vấn CNTT</strong> (covan.cntt / Covan@123)
                        </button>
                        <button type="button" class="btn btn-outline-success btn-sm text-start" onclick="fillLogin('covan.daotao', 'Covan@123')">
                            <i class="bi bi-person-badge me-1"></i><strong>Cố vấn Đào tạo</strong> (covan.daotao / Covan@123)
                        </button>
                        <button type="button" class="btn btn-outline-info btn-sm text-start text-dark" onclick="fillLogin('sinhvien1', 'Sinhvien@123')">
                            <i class="bi bi-person me-1"></i><strong>Sinh viên 1</strong> (sinhvien1 / Sinhvien@123)
                        </button>
                    </div>
                </div>

                <div class="text-center small text-muted">
                    Chưa có tài khoản sinh viên? <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Đăng ký tại đây</a>
                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/}" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay lại Trang chủ</a>
            </div>
        </div>
    </div>
</div>

<script>
function fillLogin(u, p) {
    document.getElementById('usernameInput').value = u;
    document.getElementById('passwordInput').value = p;
}
</script>

</body>
</html>
