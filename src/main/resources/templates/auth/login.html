<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css('Đăng nhập hệ thống')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center py-5" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-2">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="flex-shrink-0">
                        <rect width="40" height="40" rx="10" fill="url(#qauteLogoLoginGrad)"/>
                        <path d="M20 9L34 16.5L20 24L6 16.5L20 9Z" fill="#FFFFFF"/>
                        <path d="M11.5 20V26C11.5 29.2 15.2 31.5 20 31.5C24.8 31.5 28.5 29.2 28.5 26V20L20 24.5L11.5 20Z" fill="#FFFFFF" fill-opacity="0.88"/>
                        <path d="M34 17.5V26.5" stroke="#14B8A6" stroke-width="2.2" stroke-linecap="round"/>
                        <circle cx="34" cy="27.5" r="1.8" fill="#14B8A6"/>
                        <defs>
                            <linearGradient id="qauteLogoLoginGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#2563EB"/>
                                <stop offset="1" stop-color="#14B8A6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="fs-2 fw-extrabold text-dark tracking-tight">QAUTE</span>
                    <span class="badge" style="background-color: #14B8A6; font-size: 0.7rem;">UTE ADVISORY</span>
                </a>
                <p class="text-muted small">Cổng Đăng Nhập Hệ Thống Tư Vấn Sinh Viên</p>
            </div>

            <div class="qaute-card p-4 p-md-5 shadow-lg border-0">
                <h4 class="fw-bold text-dark mb-3 text-center">Đăng nhập tài khoản</h4>

                <!-- Flash messages -->
                <div th:if="${lockedMessage}" class="alert alert-warning py-2 small mb-3 d-flex align-items-center gap-2 border-warning">
                    <i class="bi bi-shield-lock-fill text-danger fs-5 flex-shrink-0"></i>
                    <span class="text-danger fw-bold" th:text="${lockedMessage}">Tài khoản tạm khóa 15 phút</span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                    <span th:text="${errorMessage}">Lỗi đăng nhập</span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success py-2 small mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                    <span th:text="${successMessage}">Thành công</span>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-dark">Tên đăng nhập hoặc Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" id="usernameInput" name="username" class="form-control border-start-0 ps-0" placeholder="Nhập tên đăng nhập hoặc email của bạn..." required autocomplete="username">
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label small fw-semibold text-dark mb-0">Mật khẩu</label>
                            <a th:href="@{/faq}" class="text-muted small text-decoration-none">Quên mật khẩu?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" id="passwordInput" name="password" class="form-control border-start-0 ps-0" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
                        </div>
                    </div>

                    <!-- CAPTCHA sau nhiều lần thất bại (>= 3 lần) -->
                    <div th:if="${requireCaptcha}" class="mb-4 p-3 bg-light border rounded-3">
                        <label class="form-label small fw-bold text-dark d-flex align-items-center justify-content-between mb-2">
                            <span><i class="bi bi-shield-check text-primary me-1"></i>Mã bảo vệ CAPTCHA</span>
                            <span class="text-muted small fw-normal">Phát hiện nhiều lần đăng nhập sai</span>
                        </label>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <img id="captchaImg" th:src="@{/captcha}" alt="Mã bảo vệ CAPTCHA" class="border rounded shadow-sm" style="height: 42px; cursor: pointer;" onclick="refreshCaptcha()" title="Nhấn để đổi mã khác">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshCaptcha()" title="Tải lại mã bảo vệ">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                        <input type="text" name="captcha" class="form-control form-control-sm" placeholder="Nhập 5 ký tự trong hình trên..." required autocomplete="off">
                    </div>

                    <button type="submit" class="btn btn-qaute-primary w-100 py-2 fw-bold rounded-3 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </button>
                </form>



                <div class="text-center small text-muted">
                    Chưa có tài khoản sinh viên? <a th:href="@{/register}" class="text-primary fw-semibold text-decoration-none">Đăng ký tại đây</a>
                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/}" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Quay lại Trang chủ</a>
            </div>
        </div>
    </div>
</div>

<script>
function refreshCaptcha() {
    const img = document.getElementById('captchaImg');
    if (img) {
        img.src = '/captcha?' + new Date().getTime();
    }
}
</script>

</body>
</html>
