<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css('Đội ngũ Cố vấn học tập')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container py-5">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Đội ngũ Cố vấn</li>
        </ol>
    </nav>

    <div class="text-center mb-5">
        <h1 class="fw-bold text-dark tracking-tight mb-2">Đội Ngũ Cố Vấn & Cán Bộ Tư Vấn</h1>
        <p class="text-muted">Các thầy cô phụ trách học vụ, công tác sinh viên và định hướng chuyên môn nghề nghiệp</p>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="cv : ${advisors}">
            <div class="qaute-card qaute-card-hover p-4 text-center h-100 d-flex flex-column">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                    <i class="bi bi-person-workspace fs-1"></i>
                </div>
                <h5 class="fw-bold mb-1 text-dark" th:text="${cv.taiKhoan.hoTen}">Họ tên cố vấn</h5>
                <div class="text-primary small fw-semibold mb-1" th:text="${cv.hocHamHocVi + ' - ' + cv.chucVu}">Học hàm/Học vị - Chức vụ</div>
                <div class="text-muted small mb-3"><i class="bi bi-building me-1"></i><span th:text="${cv.donVi.tenDonVi}">Khoa/Phòng ban</span></div>

                <div class="bg-light p-3 rounded-3 text-start small mb-3 flex-grow-1">
                    <div class="fw-bold text-dark mb-1">Chuyên môn tư vấn:</div>
                    <div class="text-secondary" th:text="${cv.chuyenMon}">Chuyên môn...</div>
                    <div class="mt-2 text-muted">
                        <i class="bi bi-envelope me-1"></i><span th:text="${cv.taiKhoan.email}">email@ute.edu.vn</span>
                    </div>
                </div>

                <div class="pt-2 border-top">
                    <a th:href="@{/student/appointments(maCV=${cv.maCV})}" class="btn btn-qaute-primary w-100 py-2 rounded-pill fw-semibold">
                        <i class="bi bi-calendar-check me-1"></i>Đặt lịch hẹn tư vấn
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
