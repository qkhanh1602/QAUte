<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-css('Cẩm nang & Hướng dẫn')}"></head>
<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container py-5">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
            <li class="breadcrumb-item active" aria-current="page">Cẩm nang sinh viên</li>
        </ol>
    </nav>

    <div class="row align-items-center mb-5">
        <div class="col-lg-6">
            <h1 class="fw-bold text-dark tracking-tight mb-2">Cẩm Nang & Hướng Dẫn</h1>
            <p class="text-muted">Kho tài liệu, quy chế đào tạo và hướng dẫn học tập chính thức</p>
        </div>
        <div class="col-lg-6">
            <form th:action="@{/articles}" method="get" class="d-flex gap-2">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" name="kw" th:value="${kw}" class="form-control border-start-0 ps-0" placeholder="Tìm bài viết hướng dẫn...">
                    <button type="submit" class="btn btn-primary fw-semibold px-4">Tìm kiếm</button>
                </div>
            </form>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4 pb-2 border-bottom">
        <a th:href="@{/articles}" th:class="${selectedLinhVuc == null ? 'btn btn-primary btn-sm rounded-pill px-3' : 'btn btn-outline-secondary btn-sm rounded-pill px-3'}">
            Tất cả chủ đề
        </a>
        <a th:each="lv : ${linhVucList}" th:href="@{/articles(linhVuc=${lv.maLinhVuc})}"
           th:class="${selectedLinhVuc == lv.maLinhVuc ? 'btn btn-primary btn-sm rounded-pill px-3' : 'btn btn-outline-secondary btn-sm rounded-pill px-3'}"
           th:text="${lv.tenLinhVuc}">
            Lĩnh vực
        </a>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="article : ${articles}">
            <div class="qaute-card qaute-card-hover p-4 h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle" th:text="${article.linhVuc.tenLinhVuc}">Lĩnh vực</span>
                    <small class="text-muted"><i class="bi bi-eye me-1"></i><span th:text="${article.luotXem}">0</span> xem</small>
                </div>
                <h5 class="fw-bold mb-2">
                    <a th:href="@{'/articles/' + ${article.maBaiViet}}" class="text-dark text-decoration-none hover-primary" th:text="${article.tieuDe}">
                        Tiêu đề cẩm nang hướng dẫn...
                    </a>
                </h5>
                <p class="text-secondary small flex-grow-1" th:text="${article.tomTat}">Tóm tắt nội dung...</p>
                <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                    <small class="text-muted"><i class="bi bi-clock me-1"></i><span th:text="${#temporals.format(article.ngayDang, 'dd/MM/yyyy')}">21/09/2026</span></small>
                    <a th:href="@{'/articles/' + ${article.maBaiViet}}" class="text-primary fw-semibold small text-decoration-none">
                        Đọc chi tiết <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
