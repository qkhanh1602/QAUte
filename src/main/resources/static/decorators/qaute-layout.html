<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title><sitemesh:write property="title"/></title>
    <sitemesh:write property="head"/>
    <style>
        .qaute-skip-link {
            position: fixed;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 10000;
            padding: 0.65rem 1rem;
            border-radius: 0.5rem;
            background: #166534;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            transform: translateY(-160%);
            transition: transform 0.15s ease;
        }

        .qaute-skip-link:focus {
            color: #fff;
            transform: translateY(0);
        }
    </style>
</head>
<body class="qaute-sitemesh-shell" data-layout-engine="sitemesh">
    <a class="qaute-skip-link" href="#qaute-main-content">Đi đến nội dung chính</a>
    <span id="qaute-main-content" tabindex="-1"></span>
    <sitemesh:write property="body"/>
</body>
</html>
